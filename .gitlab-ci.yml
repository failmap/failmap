# integration tests
integration:
  <<: *test_template
  stage: test_build

  services:
    - redis:latest

  variables:
    BROKER: redis://redis:6379/0
    # required to run celery worker under docker 'root' user
    C_FORCE_ROOT: 1

  script:
    - PATH=$HOME/.cache/virtualenvs/web-security-map/bin:$PATH DJANGO_SETTINGS_MODULE=websecmap.settings make test_integration

dataset:
  <<: *test_template
  script:
    - make test_datasets

dataset_mysql:
  <<: *test_mysql_template
  script:
    - make test_datasets
  # run long tests only on master
  only: [master]

dataset_postgres:
  <<: *test_postgres_template
  script:
    - make test_datasets
  # run long tests only on master
  only: [master]

# create distributable release
build:
  stage: test_build

  services:
    - docker:$DOCKER_SERVICE_VERSION

  variables:
    GIT_SUBMODULE_STRATEGY: recursive

  image: $DOCKER_CI_IMAGE

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin

  script:
    # store current version as artifact to copy into docker container
    - python -c 'import websecmap;print(websecmap.__version__)' > version
    - export tag=$(cat version|tr + _)

    # pull potential existing image from registry built in merge request pipeline
    - docker pull websecmap/websecmap:$tag || exit 0

    # build docker image and push to registry
    - DOCKER_BUILDKIT=1 docker build --target release . --tag websecmap/websecmap:$tag
    - docker push websecmap/websecmap:$tag

  only:
    - master
    - tags
  retry: 1

# test building image & run image smoketest
image_test:
  stage: test_build

  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: 1
    SYSTEM_TEST_TIMEOUT: "120"
    GIT_SUBMODULE_STRATEGY: recursive

  services:
    - docker:$DOCKER_SERVICE_VERSION

  image: $DOCKER_CI_IMAGE

  script:
    - python -c 'import websecmap;print(websecmap.__version__)' > version
    - export tag=$(cat version|tr + _)

    # build docker image to test building
    - DOCKER_BUILDKIT=1 time docker build --target release . --tag websecmap/websecmap:$tag

    # run system tests against image
    - IMAGE=websecmap/websecmap:$tag time make test_system

  # run on merge request to determine if build will not break on master
  except: [master]
  retry: 1

test_system:
  stage: staging

  image: $DOCKER_CI_IMAGE
  services:
    - docker:$DOCKER_SERVICE_VERSION

  variables:
    SYSTEM_TEST_TIMEOUT: 120
    PIP_DISABLE_PIP_VERSION_CHECK: 1

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - python -c 'import websecmap;print(websecmap.__version__)' > version
    - export tag=$(cat version|tr + _)

    - IMAGE=websecmap/websecmap:$tag time make test_system

  only: [master]
  retry: 1

staging:
  stage: staging

  image: $DOCKER_CI_IMAGE
  services:
    - docker:$DOCKER_SERVICE_VERSION

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - python -c 'import websecmap;print(websecmap.__version__)' > version
    - export tag=$(cat version|tr + _)

    # here is where I would put my staging integration tests, if I had one!!!
    # # pull latest version and tag as staging
    # - docker pull websecmap/websecmap:$tag
    # - docker tag websecmap/websecmap:$tag websecmap/websecmap:staging
    # # promote to staging after tests have succeeded
    # - docker push websecmap/websecmap:staging

    # until there is a CD staging environment
    # promote build image to production
    - docker tag websecmap/websecmap:$tag websecmap/websecmap:latest
    - docker push websecmap/websecmap:latest

  only: [master]
  retry: 1

production:
  stage: production

  image: $DOCKER_CI_IMAGE
  services:
    - docker:$DOCKER_SERVICE_VERSION

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - export tag=$(git describe --exact-match --tags --abbrev=0)
    # build docker image and push to registry
    - docker pull websecmap/websecmap:$tag
    - docker tag websecmap/websecmap:$tag websecmap/websecmap:latest
    - docker push websecmap/websecmap:latest

    # insert deploy magic here

  only: [tags]
  retry: 1
